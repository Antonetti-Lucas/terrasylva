name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Only pip's download cache is kept between runs. Numba's compiled files are not, so
# every run compiles the kernels from the current sources.
jobs:
  full:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, python: "3.10" }
          - { os: ubuntu-24.04, python: "3.15" }
          - { os: windows-2025, python: "3.15" }
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the libraries Qt needs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-3 libegl1 libfontconfig1 libgl1 libglib2.0-0t64 libxkbcommon0

      - name: Install
        run: python -m pip install -e ".[dev,editor]"

      - name: List versions
        run: python -m pip list

      - name: Test
        run: python -m pytest -rs --junitxml=report.xml

      - name: Check for unexpected skips
        run: python .github/check_skips.py report.xml

      # for comparing runners by eye; only the test on Windows compares hashes
      - name: Print layer hashes
        if: ${{ !cancelled() }}
        run: python tests/test_layer_hashes.py

  core:
    name: core dependencies only
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install without the editor
        run: python -m pip install -e . "pytest>=7"

      - name: Check that the editor dependencies are absent
        run: |
          python -c "from importlib.util import find_spec; assert not any(map(find_spec, ('PySide6', 'moderngl')))"

      - name: List versions
        run: python -m pip list

      - name: Test
        run: python -m pytest -rs --junitxml=report.xml

      - name: Check for unexpected skips
        run: >
          python .github/check_skips.py report.xml
          "could not import 'moderngl'" "could not import 'PySide6"

      - name: Print layer hashes
        if: ${{ !cancelled() }}
        run: python tests/test_layer_hashes.py
