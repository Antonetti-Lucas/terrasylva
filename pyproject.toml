[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terrasylva"
version = "0.1.0"
description = "Procedural terrain generation with hydraulic/thermal erosion and river extraction."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "numba>=0.58", "pillow>=10.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "matplotlib>=3.7"]
editor = ["PySide6-Essentials>=6.6", "moderngl>=5.8"]

[project.scripts]
terrasylva = "terrasylva.cli:main"

[project.gui-scripts]
terrasylva-editor = "terrasylva.editor:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
